<body>
  <!-- Minimal loading placeholder (hidden when Angular app is ready; flower is in app-loading-screen) -->
  <div id="loading-screen">
    <p class="loading-placeholder-text">Cargando...</p>
  </div>

  <style>
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #e8f0e3 0%, #f8faf7 40%, #f8faf7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loading-placeholder-text {
      margin: 0;
      color: #5E794B;
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      opacity: 0.8;
    }
  </style>

  <app-root></app-root>

  <script>
    // Hide loading screen as soon as Angular app is ready, but wait at least 3 seconds
    var minLoadTime = Date.now() + 3000;

    var checkReady = setInterval(function () {
      var appRoot = document.querySelector('app-root');
      var now = Date.now();

      if (appRoot && appRoot.children.length > 0 && now >= minLoadTime) {
        clearInterval(checkReady);
        var loader = document.getElementById('loading-screen');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(function () { loader.remove(); }, 700);
        }
      }
    }, 100);

    // Fallback: hide after 10 seconds even if app not ready
    setTimeout(function () {
      clearInterval(checkReady);
      var loader = document.getElementById('loading-screen');
      if (loader && !loader.classList.contains('hidden')) {
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 700);
      }
    }, 10000);
  </script>
</body>
